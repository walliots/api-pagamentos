# values.yaml do serviço — a esteira lê daqui e registra no ServiceNow.
# strategy.canary.enabled decide a origem do deploy na tela:
#   true  -> Argo CD (Rollout canary)
#   false -> GitHub (jobs de deploy com aprovação no environment)
app:
  name: api-pagamentos
image:
  repository: argoproj/rollouts-demo
strategy:
  canary:
    enabled: true
