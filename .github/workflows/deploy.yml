# Esteira simulada (ENGPDP-19852):
#   1. lê o values.yaml (nome do serviço e strategy.canary.enabled)
#   2. cria a change no ServiceNow com o payload dos artefatos; um flow cria a CTASK e grava as versões
#   3. canary = true  -> atualiza a imagem em k8s/rollout.yaml; o Argo CD faz o canary
#      canary = false -> segue os jobs de deploy do GitHub, com aprovação no environment "producao"
#
# Secrets do repositório: SN_INSTANCE (ex. dev436806.service-now.com), SN_USER, SN_PASSWORD
name: Deploy
run-name: Deploy ${{ github.event.repository.name }} ${{ inputs.versao }}

on:
  workflow_dispatch:
    inputs:
      change_task:
        description: (Opcional, legado) CTASK; a CTASK agora é criada pelo flow
        required: false
        default: ''
      versao:
        description: Versão a implantar (cor da imagem de demonstração)
        required: true
        type: choice
        options: [blue, green, yellow, red, purple, orange]

permissions:
  contents: write

env:
  SN_TABLE: x_1022012_devops_0_sn_devops_artifact_version

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      canary: ${{ steps.values.outputs.canary }}
      nome: ${{ steps.values.outputs.nome }}
    steps:
      - uses: actions/checkout@v4
      - id: values
        name: Ler values.yaml
        run: |
          echo "canary=$(yq '.strategy.canary.enabled // false' values.yaml)" >> "$GITHUB_OUTPUT"
          echo "nome=$(yq '.app.name' values.yaml)" >> "$GITHUB_OUTPUT"
          echo "canary: $(yq '.strategy.canary.enabled // false' values.yaml)"

  change:
    needs: preparar
    runs-on: ubuntu-latest
    steps:
      - name: Montar payload da change
        id: payload
        env:
          NOME: ${{ needs.preparar.outputs.nome }}
          CANARY: ${{ needs.preparar.outputs.canary }}
          VERSAO: ${{ inputs.versao }}
        run: |
          deploy=$(jq -cn --arg name "$NOME" --arg version "$VERSAO" --arg repo "${{ github.repository }}"             --arg run "${{ github.run_id }}" --argjson canary "$CANARY"             '{artifacts:[{name:$name, version:$version, repository:$repo, run_id:$run, argo_application:$name, canary_enabled:$canary}]}')
          cr=$(jq -cn --arg sd "Deploy $NOME $VERSAO" --arg payload "$deploy"             '{attributes:{short_description:$sd, x_1022012_devops_0_u_deploy_payload:$payload}}')
          echo "cr=$cr" >> "$GITHUB_OUTPUT"
      - name: Criar change no ServiceNow
        id: chg
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: change
          interval: '15'
          change-request: ${{ steps.payload.outputs.cr }}
      - name: Publicar o link da change no resumo do run
        if: success()
        env:
          CHG_NUMBER: ${{ steps.chg.outputs.change-request-number }}
          CHG_SYS_ID: ${{ steps.chg.outputs.change-request-sys-id }}
          SN_URL: ${{ vars.SN_INSTANCE_URL }}
        run: |
          if [ -z "$CHG_NUMBER" ] || [ -z "$CHG_SYS_ID" ]; then
            echo "A action não devolveu o número da change; nada a publicar."
            exit 0
          fi
          url="${SN_URL}/nav_to.do?uri=change_request.do%3Fsys_id%3D${CHG_SYS_ID}"
          echo "::notice title=Change no ServiceNow::${CHG_NUMBER} - ${url}"
          { echo "### Change no ServiceNow"; echo; echo "[${CHG_NUMBER}](${url})"; } >> "$GITHUB_STEP_SUMMARY"

  # ---------- canary = true: GitOps, o Argo CD faz o deploy ----------
  deploy-argo:
    needs: [preparar, change]
    if: needs.preparar.outputs.canary == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar imagem no manifesto
        env:
          VERSAO: ${{ inputs.versao }}
        run: |
          yq -i '.spec.template.spec.containers[0].image = "argoproj/rollouts-demo:" + strenv(VERSAO)' k8s/rollout.yaml
          if git diff --quiet; then
            echo "Imagem já está em $VERSAO; nada para implantar."
            exit 0
          fi
          git config user.name "esteira"
          git config user.email "esteira@users.noreply.github.com"
          git commit -am "deploy ${VERSAO} - ${{ inputs.change_task }}"
          git push

  # ---------- canary = false: deploy pelo GitHub ----------
  build:
    needs: [preparar, change]
    if: needs.preparar.outputs.canary != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "build ${{ inputs.versao }}" && sleep 20

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "testes" && sleep 20

  deploy-hml:
    needs: test
    runs-on: ubuntu-latest
    environment: hml
    steps:
      - run: echo "deploy HML" && sleep 15

  deploy-producao:
    needs: deploy-hml
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - run: echo "deploy produção" && sleep 15
